listening-port=3478
tls-listening-port=5349
listening-ip=0.0.0.0
# external-ip=PUBLIC_IP/PRIVATE_IP  (set by install.sh when the VPS is behind NAT)
min-port=49152
max-port=49999
fingerprint
use-auth-secret
static-auth-secret=__REPLACED_BY_INSTALL_SH__
realm=__TURN_REALM__
cert=/etc/chattercrab/tls/fullchain.pem
pkey=/etc/chattercrab/tls/privkey.pem
no-multicast-peers
no-cli
no-tlsv1
no-tlsv1_1
stale-nonce=600
user-quota=12
total-quota=100
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.168.0.0-192.168.255.255
denied-peer-ip=127.0.0.0-127.255.255.255
denied-peer-ip=169.254.0.0-169.254.255.255
no-rfc5780
no-stun-backward-compatibility
syslog
