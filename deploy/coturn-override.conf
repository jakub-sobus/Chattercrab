# systemd drop-in for coturn, installed as
# /etc/systemd/system/coturn.service.d/override.conf by install.sh.
[Unit]
# Wait for the network so listening-ip/external-ip resolve correctly.
After=network-online.target
Wants=network-online.target

[Service]
# Each relayed allocation uses sockets; raise the descriptor limit well above
# total-quota * (ports per allocation).
LimitNOFILE=65536
# Coturn reads certificates from /etc/chattercrab/tls via the chattercrab group.
SupplementaryGroups=chattercrab
Restart=on-failure
RestartSec=3
